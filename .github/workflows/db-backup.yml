name: Database Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Database Backup
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL Client
        run: |
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

          # Detect server major version and install matching client to avoid pg_dump version mismatch
          PG_VERSION=$(psql "${{ secrets.PROD_DATABASE_URL }}" -t -A -c "SHOW server_version;" 2>/dev/null | awk -F'.' '{print $1}' | tr -d '[:space:]')
          if [ -n "$PG_VERSION" ] && [ "$PG_VERSION" -ge 12 ] 2>/dev/null; then
            echo "Detected PostgreSQL server major version: $PG_VERSION"
            sudo apt-get install -y -qq "postgresql-client-$PG_VERSION"
            if [ -d "/usr/lib/postgresql/$PG_VERSION/bin" ]; then
              echo "/usr/lib/postgresql/$PG_VERSION/bin" >> $GITHUB_PATH
            fi
          fi

      - name: Run pg_dump
        run: |
          BACKUP_FILE="db_backup_$(date +%Y%m%d_%H%M%S).dump"
          echo "BACKUP_FILE=$BACKUP_FILE" >> $GITHUB_ENV
          pg_dump "${{ secrets.PROD_DATABASE_URL }}" --format=custom --file="$BACKUP_FILE"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: "*.dump"
          retention-days: 7
